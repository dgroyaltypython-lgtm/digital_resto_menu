{% load static %}
<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Coastal Pearl · Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>

<body class="counter">
    <div class="ambient a1"></div>
    <div class="ambient a2"></div>
    <main class="login">
        <section class="glass login-card">
            <div class="bell">🔔</div>
            <div class="eyebrow">GROUP OF BBN · COASTAL PEARL</div>
            <h1>Counter Dashboard</h1>
            <p>Sign in to receive live table service alerts.</p><label>Username</label><input id="u" class="input"
                autocomplete="username" placeholder="Username"><label>Password</label><input id="p" type="password"
                class="input" autocomplete="current-password" placeholder="Password"><button id="go" class="primary">🔔
                ENTER COUNTER</button>
            <div id="err" class="error"></div><small>Counter system ready</small>
        </section>
    </main>
    <script>function cookie(n) { let x = document.cookie.split(';').find(v => v.trim().startsWith(n + '=')); return x ? decodeURIComponent(x.trim().substring(n.length + 1)) : '' } async function go() { let u = document.getElementById('u').value.trim(), p = document.getElementById('p').value, e = document.getElementById('err'), b = document.getElementById('go'); e.textContent = ''; if (!u || !p) { e.textContent = 'Enter username and password.'; return } b.disabled = true; b.textContent = '⏳ CONNECTING...'; try { let r = await fetch('{% url "counter_login_api" %}', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': cookie('csrftoken') }, body: JSON.stringify({ username: u, password: p }) }); let d = await r.json(); if (r.ok && d.ok) { location.href = '{% url "counter_dashboard" %}'; return } e.textContent = d.message || 'Login failed.' } catch (x) { e.textContent = 'Unable to connect to server.' } b.disabled = false; b.textContent = '🔔 ENTER COUNTER' } document.getElementById('go').onclick = go; document.addEventListener('keydown', e => { if (e.key === 'Enter') go() });</script>
</body>

</html>
